<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        margin: 0 auto;
        width: 400px;
        /* border: 1px solid #000; */
        margin-top: 100px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="item">赠送:礼品</div>
    </div>
    <script>
      const gift = '香蕉,苹果,橘子,橙子'
      document.querySelector('.box').innerHTML += gift
        .split(',')
        .map((item) => `<div class="item">赠送:${item}</div>`)
        .join('')

      const Star = function (name, age) {
        this.name = name
        this.age = age
      }
      Star.prototype.sing = () => {
        console.log('唱歌')
      }
      const s1 = new Star('张三', 18)
      const s2 = new Star('李四', 28)
      console.log(Star.prototype)
      console.log(s1.sing === s2.sing)
      const a = [1, 2, 3, 4, 5]
      console.log(...a)
    </script>
  </body>
</html>
