<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        display: flex;
        /* justify-content: center; */
        align-items: center;
        gap: 10px
    }

    .right {
        color: green;
    }

    .error {
        color: red;
    }
</style>

<body>
    <div class="box">
        <input type="text">
        <div class="state"></div>
    </div>
</body>
<script>
    const reg = /^[0-9a-zA-Z-_]{6,10}$/
    const input = document.querySelector('input')
    const state = input.nextElementSibling
    input.addEventListener('change', () => {
        if (reg.test(input.value)) {
            state.className = 'right'
            state.innerHTML = `right`
        } else {
            state.className = 'error'
            state.innerHTML = `error`
        }
    })

</script>

</html>
