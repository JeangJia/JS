<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //event loop
        // 事件循环
        // 事件循环是指浏览器或 Node.js 等运行时环境中用于处理异步操作的机制.
        // 它允许在执行同步代码的同时,处理异步操作的结果.
        // 事件循环的基本原理是将异步操作放入一个事件队列中,当同步代码执行完成后,
        // 事件循环会从队列中取出事件并执行其对应的回调函数.
        // 这样,即使异步操作是在同步代码之后才触发的,也能够被及时处理.

        // 事件循环示例
        console.log('同步代码1');
        setTimeout(function () {
            console.log('异步代码1');
        }, 1000);
        console.log('同步代码2');
    </script>

</body>

</html>
