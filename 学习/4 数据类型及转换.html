<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 数据类型
        // typeof 可以查看变量的数据类型
        //1.数字类型 number
        let a = 10;
        console.log(a);
        console.log(typeof a);
        //2.字符串类型 string
        let b = 'hello';
        console.log(b);
        console.log(typeof b);
        //3.布尔类型 boolean
        let c = true;
        console.log(c);
        console.log(typeof c);
        //4.数组类型 array
        let d = [1, 2, 3, 4, 5];
        console.log(d);
        console.log(typeof d);
        //5.对象类型 object
        let e = {
            name: '张三',
            age: 18
        };
        console.log(e);
        console.log(typeof e);
        //6.空类型 null
        let f = null;
        console.log(f);
        console.log(typeof f);
        //7.未定义类型 undefined
        let g;
        console.log(g);
        console.log(typeof g);

        //数据类型转换
        //1.隐式类型转换
        let h = 10 + '20';
        console.log(h);
        console.log(typeof h);
        h = 10 + +'20';//+可以将字符串转换为数字
        console.log(h);
        console.log(typeof h);

        //2.显式类型转换
        //Number() parseInt() parseFloat()
        let str = '123'
        console.log(str);
        console.log(typeof str);
        let num = Number(str);
        console.log(num);
        console.log(typeof num);
        //parseInt() 可以将字符串转换为整数
        //parseFloat() 可以将字符串转换为浮点数
        let str1 = '123.456px';
        console.log(parseInt(str1));
        console.log(parseFloat(str1));
    </script>
</body>

</html>
