<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    // 原型(Prototype) 是实现对象继承和属性共享的核心机制
    // 每个对象(除了 null 和 Object.prototype 本身)都隐含一个指向其原型对象的内部链接

    // 构造函数
    function Star(name, age) {
      // 公共的属性, 直接添加到构造函数中
      this.name = name
      this.age = age
      // 直接添加到构造函数中, 会导致每个实例都有一个方法, 占用内存空间
      // this.sayName = function () {
      //     console.log(this.name)
      // }
    }
    // 公共的方法,使用原型链添加,而不是直接添加到构造函数中
    Star.prototype.sayName = function () {
      // 构造函数和原型里面的this都指向当前实例对象
      // 构造函数中this.name 和 原型链中的this.name 是两个不同的变量, 一个在构造函数中, 一个在原型链中
      console.log(this.name)
    }
    Star.prototype.sayAge = function () {
      console.log(this.age)
    }
    const p1 = new Star('张三', 18)
    console.log(p1)
    p1.sayName()
    p1.sayAge()

    // 批量挂载原型方法
    // 通过 prototype 添加的属性和方法, 会覆盖构造函数中的属性和方法
    Star.prototype = {
      constructor: Star, // 恢复原型对象的 constructor 指向,让原型和构造函数保持正确的关联关系.
      sing: function () {
        console.log('唱歌')
      },
      dance: function () {
        console.log('跳舞')
      },
    }
    console.log(Star.prototype)
    const b = new Star('李四', 20)
    b.sing()
    b.dance()
  </script>
</html>
