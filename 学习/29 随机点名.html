<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机点名</title>
    <style>
        h1 {
            text-align: center;
        }

        div {
            text-align: center;
            font-size: 25px;
            margin: 20px 0;
        }

        .name {
            font-size: 20px;
            color: red;
        }

        button {
            text-align: center;
            margin: 20px 20px;
            padding: 8px 8px;
        }
    </style>
</head>

<body>
    <h1>随机点名</h1>
    <div>名字是:&nbsp;&nbsp;<span class="name">??? </span> </div>
    <div>
        <button class="start">开始</button>
        <button class="end">结束</button>
    </div>

    <script>
        function random(min, max) {
            return parseInt(Math.random() * (max - min + 1) + min)
        }

        const nameData = ['关羽', '张飞', '赵云', '马超', '黄忠', '刘备', '曹操', '孙权', '周瑜']
        // const nameData = ['关羽', '孙权', '周瑜']
        const nameSpan = document.querySelector('.name')
        const startBtn = document.querySelector('.start')
        const endBtn = document.querySelector('.end')
        let intervalId = null  // 定时器ID放在外部作用域
        let currentIndex = -1  // 当前选中的索引

        // 开始按钮点击事件
        startBtn.addEventListener('click', function () {
            // 如果已经有定时器在运行,先清除
            if (intervalId) {
                clearInterval(intervalId)
            }

            // 开始随机切换名字
            intervalId = setInterval(function () {
                currentIndex = random(0, nameData.length - 1)
                nameSpan.innerHTML = nameData[currentIndex]
                if (nameData.length === 1) {
                    startBtn.disabled = true
                    endBtn.disabled = true
                    clearInterval(intervalId)
                    intervalId = null
                    return
                }
            }, 10)
        })

        // 结束按钮点击事件(放在外部,避免重复绑定)
        endBtn.addEventListener('click', function () {
            if (intervalId) {
                clearInterval(intervalId)
                intervalId = null

                // 从数组中移除当前选中的名字
                if (currentIndex !== -1 && nameData.length > 0) {
                    nameData.splice(currentIndex, 1)
                    currentIndex = -1
                }
            }
            console.log(nameData);
        })
    </script>
</body>

</html>
