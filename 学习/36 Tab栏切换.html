<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    a {
        text-decoration: none;
        color: #fff;
    }

    .tabBox {
        margin: 0 auto;
        margin-top: 100px;
        width: 600px;
        height: 280px;
        /* background-color: pink; */
    }

    .head {
        height: 45px;
        background-color: purple;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }

    .title,
    .nav {
        float: left;
    }

    .title {
        font-size: 24px;
        color: #fff;
    }

    ul li {
        float: left;
        margin-left: 20px;
        list-style: none;
    }

    ul li {
        display: block;
        font-size: 16px;
        box-sizing: border-box;
    }

    .item {
        width: 100%;
        height: 235px;
        background: url(images/1.jpg) no-repeat center center;
        background-size: cover;
    }

    .active {
        color: #ff6600;
        border-bottom: 1px solid #ff6600;
    }
</style>

<body>
    <div class="tabBox">
        <div class="head">
            <div class="title">
                每日特价
            </div>
            <div class="nav">
                <ul>
                    <li><a href="#" class="active">精选</a></li>
                    <li><a href="#">美食</a></li>
                    <li><a href="#">百货</a></li>
                    <li><a href="#">个护</a></li>
                    <li><a href="#">预告</a></li>
                </ul>
            </div>
        </div>
        <div class="item">
        </div>
    </div>
</body>
<script>
    const itemData = [
        { img: './images/1.jpg', title: '精选' },
        { img: './images/2.jpg', title: '美食' },
        { img: './images/3.jpg', title: '百货' },
        { img: './images/4.jpg', title: '个护' },
        { img: './images/5.jpg', title: '预告' }
    ];
    const as = document.querySelectorAll('ul li a'); // 获取所有 a 标签
    const item = document.querySelector('.item');
    for (let i = 0; i < as.length; i++) {
        as[i].addEventListener('mouseenter', function () {
            //移除所有 a 标签的 active 类名
            document.querySelector('.active').classList.remove('active');
            //给指定 a 标签添加 active 类名
            this.classList.add('active');
            item.style.backgroundImage = `url(${itemData[i + 1].img})`;
        })
    }
</script>

</html>
