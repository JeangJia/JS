<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        height: 6000px;
    }

    .head {
        height: 50px;
        width: 100%;
        background-color: khaki;
        position: fixed;
        top: -50px;
        left: 0;
        transition: all .3s;
        z-index: 9;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .topnav {
        display: flex;
        align-items: center;
        gap: 40px;
        position: relative;
        font-size: 16px;
    }

    .topnav span {
        cursor: pointer;
        padding: 0 10px;
    }

    .line {
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 50px;
        height: 2px;
        background-color: green;
        transition: all 0.3s;
    }

    .nav {
        height: 320px;
        width: 65px;
        background-color: rgb(111, 203, 184);
        position: fixed;
        top: 100px;
        right: 10px;
        opacity: 0;
        transition: all .3s;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
    }

    .nav span {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    .nav span:hover {
        background-color: yellowgreen;
        color: aliceblue;
    }

    .fbox {
        width: 800px;
        height: 500px;
        margin: 0 auto;
        background-color: #ccc;
    }

    .flag {
        height: 20px;
        width: 800px;
        position: absolute;
        top: 200px;
        background-color: pink;
    }

    .box {
        width: 800px;
        height: 500px;
        margin: 50px auto;
        background-color: #ccc;
        text-align: center;
        line-height: 500px;
        font-size: 24px;
    }

    .active {
        background-color: yellowgreen !important;
        color: aliceblue !important;
    }
</style>
<body>

<div class="head">
    <div class="topnav">
        <span>case1</span>
        <span>case2</span>
        <span>case3</span>
        <span>case4</span>
        <div class="line"></div>
    </div>
</div>

<div class="nav">
    <span class="backtop active">👆</span>
    <span>case1</span>
    <span>case2</span>
    <span>case3</span>
    <span>case4</span>
</div>

<div class="fbox">
    <span class="flag"></span>
</div>
<div class="box box1">case1</div>
<div class="box box2">case2</div>
<div class="box box3">case3</div>
<div class="box box4">case4</div>

<script>
    const head = document.querySelector('.head')
    const nav = document.querySelector('.nav')
    const flag = document.querySelector('.flag')
    const line = document.querySelector('.line')
    const topSpan = document.querySelectorAll('.topnav span')
    const cs = document.querySelectorAll('.nav span')
    const bs = document.querySelectorAll('.fbox, .box')

    line.style.width = topSpan[0].offsetWidth + 'px'
    line.style.left = topSpan[0].offsetLeft + 'px'

    window.addEventListener('scroll', () => {
        const st = document.documentElement.scrollTop
        const hf = flag.offsetTop
        head.style.top = st >= hf ? '0px' : '-50px'
        nav.style.opacity = st >= hf ? '1' : '0'

        for (let i = 0; i < bs.length; i++) {
            if (st >= bs[i].offsetTop - 100) {
                document.querySelector('.nav .active').classList.remove('active')
                cs[i].classList.add('active')
                if (i > 0) {
                    line.style.left = topSpan[i - 1].offsetLeft + 'px'
                    line.style.width = topSpan[i - 1].offsetWidth + 'px'
                }
            }
        }
    })

    // 右侧点击
    for (let i = 0; i < cs.length; i++) {
        cs[i].addEventListener('click', () => {
            window.scrollTo({
                top: bs[i].offsetTop - 50,
                behavior: 'smooth'
            })
            document.querySelector('.active').classList.remove('active')
            cs[i].classList.add('active')
        })
    }
    for (let i = 0; i < topSpan.length; i++) {
        topSpan[i].addEventListener('click', () => {
            window.scrollTo({
                top: bs[i + 1].offsetTop - 50,
                behavior: 'smooth'
            })
            line.style.left = topSpan[i].offsetLeft + 'px'
            line.style.width = topSpan[i].offsetWidth + 'px'
        })
    }
</script>
</body>
</html>
