<script>
    function geiTime() {
        let s = +prompt('请输入秒数:');
        let temp = s;
        while (s < 0) {
            s = +prompt('请输入正确的秒数:');
        }
        let h = 0
        let m = 0
        if (s >= 3600) {
            h = parseInt(s / 3600)
            s = (s % 3600)
        }
        if (s >= 60) {
            m = parseInt(s / 60)
            s = (s % 60)
        }
        h = h < 10 ? '0' + h : h;
        m = m < 10 ? '0' + m : m;
        s = s < 10 ? '0' + s : s;
        document.write(`${temp}秒转换为时间为: ${h}小时${m}分${s}秒`)
    }
    geiTime();
</script>
