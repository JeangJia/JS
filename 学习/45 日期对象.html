<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    div,
    p {
        width: 280px;
        height: 40px;
        margin: 100px auto;
        text-align: center;
        line-height: 40px;
        border: 1px solid black;
    }
</style>

<body>
    <div></div>
    <p>当前时间</p>
    <script>
        const div = document.querySelector('div')
        const p = document.querySelector('p')
        // 日期对象
        // 创建日期对象
        // new Date()
        function geyDate() {
            let date = new Date()//实例化日期对象 获取当前时间
            const year = date.getFullYear()
            const month = date.getMonth() + 1//月份和星期从0开始  星期天是0
            const day = date.getDate()
            const hour = date.getHours() >= 10 ? date.getHours() : `0${date.getHours()}`
            const minute = date.getMinutes() >= 10 ? date.getMinutes() : `0${date.getMinutes()}`
            const second = date.getSeconds() >= 10 ? date.getSeconds() : `0${date.getSeconds()}`
            return `${year}年${month}月${day}日${hour}时${minute}分${second}秒`
        }
        div.innerHTML = geyDate()
        setInterval(function () {
            div.innerHTML = geyDate()
        }, 1000)
        // 获取当前日期和时间
        const date = new Date()
        p.innerHTML = date.toLocaleDateString() + ' ' + date.toLocaleTimeString()
        //getDay() 获取星期
        const day = ['星期天', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六']
        //0-6  星期天是0
        p.innerHTML += `<br>${day[date.getDay()]}`
    </script>
</body>

</html>
