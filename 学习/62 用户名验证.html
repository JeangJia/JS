<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户名验证</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    div {
        margin: 100px auto;
        display: flex;
        align-items: center;
    }

    input {
        width: 180px;
        height: 30px;
        padding-left: 10px;
        box-sizing: border-box;
    }

    .right {
        height: 20px;
        line-height: 20px;
        background-color: green;
        color: #fff;
        border-radius: 5px;
        padding: 0 10px;
        margin-left: 10px;
    }

    .error {
        height: 20px;
        line-height: 20px;
        background-color: red;
        color: #fff;
        border-radius: 5px;
        padding: 0 10px;
        margin-left: 10px;
    }
</style>

<body>
    <div>
        <input type="text" id="username" placeholder="请输入用户名">
        <span id="msg" class="msg"></span>
    </div>
</body>
<script>
    const reg = /^[a-zA-Z0-9_-]{2,8}$/
    const input = document.querySelector('input')
    const span = document.querySelector('span')
    input.addEventListener('blur', function () {
        const value = input.value.trim()
        if (reg.test(value)) {
            span.innerHTML = '用户名格式正确'
            span.classList.remove('error')
            span.classList.add('right')
        } else {
            span.innerHTML = '输入数字、字母、下划线或短横线'
            span.classList.remove('right')
            span.classList.add('error')
            //也可以直接有className属性 覆盖之前的类名
            // span.className = 'error'
        }
    })

</script>

</html>
