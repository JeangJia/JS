<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body></body>
  <script>
    // 动态参数
    // arguments 是一个类数组对象 只存在于函数中 箭头函数没有
    // 可以使用数组的方法
    function fn() {
      // arguments 是一个伪数组
      console.log(arguments)
      let sum = 0
      for (let i = 0; i < arguments.length; i++) {
        sum += arguments[i]
      }
      console.log(sum)
    }
    fn(1, 2, 3, 4, 5)
    console.log('------------------')

    // 剩余参数 是一个数组
    // 剩余参数只能写在最后面
    function fn2(a, b, ...args) {
      // args 是一个真数组
      console.log(a, b, args)
      let sum = 0
      for (let i = 0; i < args.length; i++) {
        sum += args[i]
      }
      console.log(sum)
    }
    fn2(1, 2, 3, 4, 5)
    console.log('------------------')

    // 展开运算符
    // 可以将数组展开成多个参数
    function fn3(a, b, c) {
      console.log(a, b, c)
    }
    let arr = [1, 2, 3]
    fn3(...arr)
    console.log(Math.max(...arr)) // 3
    // 展开运算符 可以将数组展开成多个参数
    // 也可以将多个参数展开成一个数组
    let arr2 = [...arr, 4, 5, 6]
    console.log(arr2)
  </script>
</html>
