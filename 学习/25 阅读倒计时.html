<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button {
        height: 36px;
        width: 100px;
        font-size: 14px;
        cursor: not-allowed; /* 倒计时时显示禁止光标 */
    }
    button:enabled {
        cursor: pointer; /* 可用时变成手型 */
    }
    span {
        margin-right: 4px;
        color: red;
    }
</style>

<body>
    <button><span>5</span>同意</button>

    <script>
        const but = document.querySelector('button')
        const sp = document.querySelector('span')
        let s = 10
        sp.innerHTML = s
        but.disabled = true

        let id = setInterval(function () {
            s--
            sp.innerHTML = s

            if (s <= 0) {
                but.disabled = false
                sp.innerHTML = ''
                clearInterval(id)
            }
        }, 1000)
    </script>
</body>

</html>
