<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    .box {
        width: 280px;
        height: 380px;
        margin: 80px auto;
        background-color: rgb(128, 24, 24);
        text-align: center;
        color: white;
        box-sizing: border-box;
        padding-top: 20px;
        border-radius: 28px;
        border: 1px solid black;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .today {
        font-size: 20px;
    }

    .title {
        font-size: 30px;
        margin: 20px 0;
        font-weight: bold;
    }

    .countdown {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .countdown p {
        width: 50px;
        height: 50px;
        background-color: #313131;
        text-align: center;
        line-height: 50px;
        border-radius: 12px;
    }

    .countdown span {
        margin: 0 10px;
    }

    .end {
        margin-top: 48px;
        font-size: 20px;
    }
</style>

<body>
    <div class="box">
        <div class="today">
            <p>今天是2023年12月25日</p>
        </div>
        <div class="title">毕业倒计时</div>
        <div class="countdown">
            <p class="hour">00</p>
            <span>:</span>
            <p class="minute">00</p>
            <span>:</span>
            <p class="second">00</p>
        </div>
        <div class="end">
            <p>2028年6月7日毕业</p>
        </div>
    </div>
    <script>
        const today = document.querySelector('.today')
        const hour = document.querySelector('.hour')
        const minute = document.querySelector('.minute')
        const second = document.querySelector('.second')
        const end = '2028-06-07 00:00:00'//终止时间
        // 毕业倒计时
        function gatToday() {
            const date = new Date()
            const year = date.getFullYear()
            const month = date.getMonth() + 1
            const day = date.getDate()
            return `今天是${year}年${month}月${day}日`

        }
        function countdown() {
            const endDate = new Date(end)
            const todayDate = +new Date()
            const timeDiff = endDate - todayDate
            const h = parseInt(timeDiff / (1000 * 60 * 60))
            const m = Math.floor(timeDiff / (1000 * 60) % 60)
            const s = Math.floor(timeDiff / 1000 % 60)
            hour.innerHTML = h >= 10 ? h : `0${h}`
            minute.innerHTML = m >= 10 ? m : `0${m}`
            second.innerHTML = s >= 10 ? s : `0${s}`
        }

        setInterval(function () {
            today.innerHTML = gatToday()
            countdown()
        }, 1000)

    </script>
</body>

</html>
