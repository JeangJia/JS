<!DOCTYPE html>

<script>
    // 数学内置对象
    console.log(Math);
    // 圆周率
    console.log(Math.PI);
    // ceil() 天花板 取上限
    console.log('------------------------')
    console.log(Math.ceil(3.14));//4
    console.log(Math.ceil(3.9));  //4
    // floor() 地板 取下限
    console.log('------------------------')
    console.log(Math.floor(3.1)); //3
    console.log(Math.floor(3.9)); //3
    // round() 四舍五入
    console.log('------------------------')
    console.log(Math.round(3.14)); //3
    console.log(Math.round(3.9));  //4
    console.log(Math.round(-3.14)); //-3
    console.log(Math.round(-3.9));  //-4
    console.log('------------------------')
    //abs() 绝对值
    console.log(Math.abs(-3.14)); //3.14
    console.log('------------------------')
    //max()/min() 最大值/最小值
    console.log(Math.max(1, 2, 3, 4, 5)); //5
    console.log(Math.min(1, 2, 3, 4, -5)); //-5
    console.log(Math.min([1, 2, 3, 4, -5]));//NaN
    //pow() 指数
    console.log(Math.pow(2, 3)); //8
    console.log('------------------------')
    //sqrt() 平方根
    console.log(Math.sqrt(16)); //4
    console.log('------------------------')
    // random() 随机数
    console.log(Math.random()); //0-1之间的随机小数 [0,1)
    console.log(Math.random() * 100);//0-100之间的随机小数
    console.log(Math.floor(Math.random() * 100));//0-100之间的随机数
    // N~M之间的随机数 Math.floor(Math.random() * (M-N+1)) + N
    function getRandom(N, M) {
        return Math.floor(Math.random() * (M - N + 1)) + N;
    }
    console.log(getRandom(100, 200));//100-200之间的随机数
    console.log(Math.floor(Math.random() * 100) + 101);//100-200之间的随机数
</script>

</html>
