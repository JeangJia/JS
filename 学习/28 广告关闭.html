<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        position: relative;
        margin: 100px auto;
        width: 600px;
        height: 200px;
        background-color: #ccc;
        text-align: center;
        line-height: 200px;
    }

    .close {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 15px;
        height: 15px;
        color: #000;
        background-color: #fff;
        text-align: center;
        line-height: 12px;
        cursor: pointer;
        border: 0;
    }
</style>

<body>
    <div class="box">
        <div class="hot">
            <h3>广告</h3>
        </div>
        <div class="close">x</div>
    </div>
    <script>
        const close = document.querySelector('.close')
        const box = document.querySelector('.box')
        close.addEventListener('click', function () {
            box.style.display = 'none'
        })
    </script>
</body>

</html>
