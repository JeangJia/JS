<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      //变量的定义
      //变量名只能包含字母、数字、下划线和美元符号不能以数字开头
      let a = 10
      console.log(a)
      let b = 20.655
      // toFixed()方法可以将数字转换为字符串并指定保留的小数位数
      console.log(b.toFixed(2)) //四舍五入
      document.write(a)
      document.write(b)
      let c = a
      a = b
      b = c
      document.write(a)
      document.write(b)
      //变量的使用
      const PI = 3.1415926
      console.log(PI)
    </script>
  </body>
</html>
