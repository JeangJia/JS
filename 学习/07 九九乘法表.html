    span {
        display: inline-block;
        width: 100px;
        padding: 5px 10px;
        margin-top: 10px;
        margin-left: 10px;
        text-align: center;
        line-height: 30px;
        background-color: skyblue;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        color: #fff;
    }
</style>

<body>

</body>
<script>

    for (let i = 1; i <= 9; i++) {
        for (let j = 1; j <= i; j++) {
            document.write(`<span>${i} x ${j} = ${i * j}</span>`)
        }
        document.write(`<br>`)
    }

</script>
