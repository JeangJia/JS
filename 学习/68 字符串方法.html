<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript 字符串方法笔记</title>
  </head>

  <body></body>
  <script>
    // ==================== 一、字符串基础属性 ====================
    let str = 'hello world'
    // 1. length:获取字符串长度(字符个数)
    console.log(str.length) // 输出:11

    // ==================== 二、字符串 ↔ 数组转换 ====================
    // split('分隔符'):将字符串按指定分隔符拆分为数组(与Array.join()相反)
    // 分隔符规则:
    // - 空格' ':按空格分割
    // - 空字符串'':按单个字符分割
    // - 不存在的分隔符:返回包含原字符串的单元素数组
    const arr1 = str.split(' ') // 按空格分割:["hello", "world"]
    const arr2 = str.split('') // 按单个字符分割:["h","e","l","l","o"," ","w","o","r","l","d"]
    const arr3 = str.split('|') // 分隔符不存在:["hello world"]
    console.log(arr1)

    // ==================== 三、字符串截取 ====================
    // substring(start[, end]):截取子串,start起始索引(必传),end结束索引(可选,不包含)
    // 特性:若start > end,自动交换位置;索引越界则取到字符串边界
    console.log(str.substring(0, 5)) // 截取0-4位:hello
    console.log(str.substring(6)) // 截取6位到末尾:world
    console.log(str.substring(5, 0)) // 自动交换:截取0-4位 → hello

    // 补充:slice(start[, end])(推荐):支持负数索引(从末尾倒数)
    console.log(str.slice(-5)) // 截取最后5位:world

    // ==================== 四、字符串判断(包含/开头/结尾) ====================
    str = 'hello world' // 重置字符串,避免后续操作影响

    // 1. startsWith(搜索串[, 起始位置]):判断是否以指定字符串开头
    console.log(str.startsWith('hello')) // true(默认从0位开始)
    console.log(str.startsWith('world', 6)) // true(从第6位开始搜索)

    // 2. endsWith(搜索串[, 截取长度]):判断是否以指定字符串结尾
    // 第二个参数:仅判断前N位字符串
    console.log(str.endsWith('world')) // true(判断完整字符串)
    console.log(str.endsWith('hello', 5)) // true(仅判断前5位)

    // 3. includes(搜索串[, 起始位置]):判断是否包含指定字符串
    console.log(str.includes('hello')) // true
    console.log(str.includes('world')) // true
    console.log(str.includes('abc')) // false
    console.log(str.includes('llo', 2)) // true(从第2位开始搜索)

    // ==================== 补充常用方法(拓展) ====================
    // 1. toUpperCase()/toLowerCase():大小写转换
    console.log(str.toUpperCase()) // HELLO WORLD
    console.log(str.toLowerCase()) // hello world

    // 2. indexOf(搜索串[, 起始位置]):查找子串首次出现的索引,无则返回-1
    console.log(str.indexOf('world')) // 6
    console.log(str.indexOf('abc')) // -1

    // 3. replace(旧串, 新串):替换首个匹配的子串(全局替换用正则 /旧串/g)
    console.log(str.replace('world', 'js')) // hello js
    console.log(str.replace(/l/g, '*')) // he**o wor*d

    // 4. trim():移除字符串首尾空格
    str = '  hello world  '
    console.log(str.trim()) // "hello world"

    // 5. toFixed(保留小数位数):将数字转换为字符串并指定保留的小数位数
    let num = 123.456789
    console.log(num.toFixed(2)) // "123.46"

    // 6. String()/toString():将数字转换为字符串
    console.log(String(num)) // "123.456789"
    console.log(num.toString()) // "123.456789"
  </script>
</html>
