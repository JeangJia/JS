    <script>
        // 事件对象 event
        // 事件对象是事件触发时浏览器自动创建的一个对象,它包含了与事件相关的信息和方法.
        // 事件对象可以在事件处理函数中作为参数传递,也可以通过事件处理函数中的事件参数来访问.
        // 事件对象的属性和方法可以帮助我们获取事件的详细信息,如事件类型、事件目标、鼠标位置、键盘按键等.
        // 事件对象的方法还可以用于阻止事件的默认行为或冒泡传播.

        e.preventDefault() //阻止事件的默认行为
        e.stopPropagation() //阻止事件冒泡传播

        // 事件对象的使用可以使我们更灵活地处理事件,实现更丰富的交互效果.

        // 事件对象的属性和方法可以帮助我们获取事件的详细信息,如事件类型、事件目标、鼠标位置、键盘按键等.
