<script>
    let obj = {
        name: '张三',
        age: 18,
        sex: '男'
    }
    // 遍历对象
    for (let key in obj) {
        // key 得到的事字符串类型 'name'/'age'/'sex'
        // obj[key] 得到的是属性值 key==='name'/'age'/'sex'
        console.log(key + ':' + obj[key]);
    }
</script>
