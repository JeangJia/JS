<!DOCTYPE html>
<html lang="en">

<head>

    <title>Document</title>
</head>
<style>
    table {
        margin: 0 auto;
    }

    table,
    th,
    td {
        padding: 20px 80px 20px 80px;
        border: 1px solid black;
        border-collapse: collapse;
        text-align: center;
    }

    tr:first-child {
        background-color: #1798ee;

    }

<body>

</body>

        })
    }

</script>
