<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇 | 经典小游戏</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Press Start 2P', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #1e2a1e;
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.1);
        }

        .game-panel {
            background: #0f1a0f;
            border-radius: 28px;
            padding: 20px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.3);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 3px #5b8c5a, 0 8px 20px rgba(0,0,0,0.4);
            background-color: #1e2c1a;
            cursor: pointer;
        }

        .info-area {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 20px;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .score-box {
            background: #0a0f0a;
            padding: 10px 25px;
            border-radius: 60px;
            box-shadow: inset 0 1px 3px #00000055, 0 4px 8px rgba(0,0,0,0.3);
        }

        .score-label {
            color: #b3e4a2;
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: bold;
            margin-right: 12px;
        }

        .score-value {
            color: #f9f3b0;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 5px #7fb07f;
            font-family: monospace;
        }

        .restart-btn {
            background: #e7b42c;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: monospace;
            padding: 8px 28px;
            border-radius: 50px;
            color: #1e3a1e;
            cursor: pointer;
            box-shadow: 0 5px 0 #8b5a2b;
            transition: 0.07s linear;
            letter-spacing: 1px;
        }

        .restart-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8b5a2b;
        }

        .status-text {
            background: #00000066;
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffecb3;
            text-align: center;
            font-family: monospace;
        }

        .controls-tip {
            margin-top: 16px;
            text-align: center;
            font-size: 0.75rem;
            color: #b0cf9a;
            background: #1f2a1b80;
            padding: 6px 12px;
            border-radius: 60px;
            display: inline-block;
            width: auto;
        }

        .footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        @media (max-width: 500px) {
            .game-container { padding: 12px; }
            .score-value { font-size: 1.5rem; }
            .restart-btn { padding: 6px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="game-panel">
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            <div class="info-area">
                <div class="score-box">
                    <span class="score-label">🍎 分数</span>
                    <span class="score-value" id="scoreDisplay">0</span>
                </div>
                <button class="restart-btn" id="restartButton">🐍 新的一局</button>
                <div class="status-text" id="gameStatusText">▶ 游戏中</div>
            </div>
            <div class="footer">
                <div class="controls-tip">⬆️ ⬇️ ⬅️ ➡️  方向键控制</div>
                <div class="controls-tip">🔄 按R键也可重开</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- 游戏配置 ----------
        const BOARD_SIZE = 20;       // 20x20 网格
        const CELL_SIZE = 20;        // 像素 400/20
        const INIT_SNAKE = [
            {x: 10, y: 10},
            {x: 9, y: 10},
            {x: 8, y: 10}
        ];
        const INIT_DIR = 'RIGHT';
        const MOVE_INTERVAL_MS = 150;  // 移动速度 (毫秒)

        // DOM 元素
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const statusDiv = document.getElementById('gameStatusText');

        // 游戏状态变量
        let snake = [...INIT_SNAKE.map(cell => ({...cell}))];  // 蛇身坐标数组
        let food = {x: 15, y: 10};     // 临时食物坐标,稍后重新生成有效食物
        let currentDir = INIT_DIR;      // 当前移动方向
        let nextDir = INIT_DIR;          // 请求的下一个方向
        let score = 0;
        let isGameActive = true;         // true: 运行中, false: 结束/胜利状态
        let isWinFlag = false;           // 用于区分胜利显示
        let gameInterval = null;          // setInterval 句柄

        // ---------- 辅助函数 ----------
        // 获取所有空白格子 (未被蛇身占据的坐标)
        function getAllEmptyCells() {
            const occupied = new Set();
            for (let segment of snake) {
                occupied.add(`${segment.x},${segment.y}`);
            }
            const empty = [];
            for (let i = 0; i < BOARD_SIZE; i++) {
                for (let j = 0; j < BOARD_SIZE; j++) {
                    if (!occupied.has(`${i},${j}`)) {
                        empty.push({x: i, y: j});
                    }
                }
            }
            return empty;
        }

        // 随机生成新食物 (基于当前蛇身),返回true表示成功,false表示没有空位(胜利)
        function generateRandomFood() {
            const emptyCells = getAllEmptyCells();
            if (emptyCells.length === 0) {
                // 无空格子 => 胜利
                return false;
            }
            const randIndex = Math.floor(Math.random() * emptyCells.length);
            food = {...emptyCells[randIndex]};
            return true;
        }

        // 重置时确保食物有效且不与蛇重叠
        function initFoodValid() {
            const empty = getAllEmptyCells();
            if (empty.length > 0) {
                food = {...empty[Math.floor(Math.random() * empty.length)]};
                return true;
            } else {
                // 极端情况: 初始蛇就占满? 不可能(初始只有3节,20x20=400), 但防御
                food = {x: 5, y: 5};
                return false;
            }
        }

        // 更新分数UI
        function updateScoreUI() {
            scoreSpan.innerText = score;
        }

        // 停止游戏循环 (清除计时器)
        function stopGameLoop() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }

        // 游戏结束 (失败或胜利)
        function endGame(isVictory = false) {
            if (!isGameActive) return;  // 已经结束
            isGameActive = false;
            isWinFlag = isVictory;
            stopGameLoop();
            // 更新状态文字
            if (isVictory) {
                statusDiv.innerHTML = '🏆 大获全胜! 🏆';
                statusDiv.style.color = "#ffd966";
            } else {
                statusDiv.innerHTML = '💀 游戏结束 💀';
                statusDiv.style.color = "#f9a26c";
            }
            draw(); // 立即绘制结束画面(显示文字)
        }

        // 重置游戏全部数据
        function resetGame() {
            // 停止旧循环
            stopGameLoop();
            // 重置数据
            snake = INIT_SNAKE.map(cell => ({...cell}));
            currentDir = INIT_DIR;
            nextDir = INIT_DIR;
            score = 0;
            isGameActive = true;
            isWinFlag = false;
            updateScoreUI();
            statusDiv.innerHTML = '▶ 游戏中';
            statusDiv.style.color = "#ffecb3";
            // 生成有效的食物 (避开蛇)
            const emptyCells = getAllEmptyCells();
            if (emptyCells.length > 0) {
                food = {...emptyCells[Math.floor(Math.random() * emptyCells.length)]};
            } else {
                // 理论不会发生,但兜底
                food = {x: 5, y: 5};
            }
            // 确保食物不会意外生成在蛇身上 (上面已经保证)
            // 重绘
            draw();
            // 启动新循环
            startGameLoop();
        }

        // 碰撞检测 (边界 或 自身)
        // 参数: newHead - 新头坐标, snakeArr - 蛇身数组, ignoreTail - 是否忽略蛇尾(未吃到食物移动时忽略最后一项)
        function checkCollision(newHead, snakeArr, ignoreTail = false) {
            // 边界碰撞
            if (newHead.x < 0 || newHead.x >= BOARD_SIZE || newHead.y < 0 || newHead.y >= BOARD_SIZE) {
                return true;
            }
            // 自身碰撞
            for (let i = 0; i < snakeArr.length; i++) {
                // 如果忽略尾部,且当前索引是最后一个元素,则跳过检查 (因为移动后会pop尾部)
                if (ignoreTail && i === snakeArr.length - 1) {
                    continue;
                }
                if (snakeArr[i].x === newHead.x && snakeArr[i].y === newHead.y) {
                    return true;
                }
            }
            return false;
        }

        // 核心移动逻辑 (每一步)
        function moveSnake() {
            if (!isGameActive) return false;  // 游戏已结束,不再移动

            // 1. 正式采用有效方向 (不能反向)
            let newDir = nextDir;
            if ((newDir === 'RIGHT' && currentDir === 'LEFT') ||
                (newDir === 'LEFT' && currentDir === 'RIGHT') ||
                (newDir === 'UP' && currentDir === 'DOWN') ||
                (newDir === 'DOWN' && currentDir === 'UP')) {
                newDir = currentDir;
            }
            currentDir = newDir;   // 更新当前方向

            // 2. 计算新蛇头
            let newHead = {...snake[0]};
            switch (currentDir) {
                case 'RIGHT': newHead.x += 1; break;
                case 'LEFT':  newHead.x -= 1; break;
                case 'UP':    newHead.y -= 1; break;
                case 'DOWN':  newHead.y += 1; break;
                default: break;
            }

            // 3. 检查是否吃到食物
            const willEat = (newHead.x === food.x && newHead.y === food.y);

            // 4. 碰撞检测 (根据是否吃东西,决定是否忽略尾部)
            let collision = false;
            if (willEat) {
                // 吃到食物: 不删除尾部,所以不能忽略任何蛇身部分(包括原尾部也不能撞)
                collision = checkCollision(newHead, snake, false);
            } else {
                // 未吃到: 移动后会删除尾部,所以碰撞检测忽略当前蛇的最后一个格子
                collision = checkCollision(newHead, snake, true);
            }

            // 边界或自身碰撞 => 游戏结束 (失败)
            if (collision) {
                endGame(false);
                draw();  // 立即绘制结束画面
                return false;
            }

            // 5. 执行移动 (先插入新头)
            snake.unshift(newHead);
            if (!willEat) {
                // 没吃到食物就移除尾部
                snake.pop();
            } else {
                // 吃到食物: 增加分数,重新生成食物,不pop(长度+1)
                score++;
                updateScoreUI();

                // 尝试生成新食物
                const successFood = generateRandomFood();
                if (!successFood) {
                    // 没有空位了 => 胜利!
                    endGame(true);
                    draw();
                    return false;
                }
            }

            // 6. 额外再检测一次极端自身碰撞 (防止因特殊逻辑遗漏,但标准移动已处理,不过安全起见)
            // 如果吃到食物后,因食物生成错误或蛇逻辑导致自碰撞? 理论不会, 但若食物生成时依然导致蛇自身bug? 无视.
            // 防止吃到食物后新头与原蛇身重叠?不应该发生,因为willEat时我们碰撞检测已经确保新头不在原蛇身任何位置(包括尾部),安全.

            // 刷新画布
            draw();
            return true;
        }

        // ---------- 绘图模块 (华丽风格) ----------
        function draw() {
            if (!ctx) return;
            // 背景网格
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 绘制暗色网格线
            ctx.strokeStyle = '#2a452a';
            ctx.lineWidth = 0.6;
            for (let i = 0; i <= BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // 绘制食物 (发光红苹果)
            ctx.shadowBlur = 0;
            const fx = food.x * CELL_SIZE;
            const fy = food.y * CELL_SIZE;
            ctx.beginPath();
            ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE/2 - 2, 0, Math.PI*2);
            ctx.fillStyle = '#ff5e5e';
            ctx.fill();
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#ffa047';
            ctx.beginPath();
            ctx.arc(fx + CELL_SIZE/2, fy + CELL_SIZE/2, CELL_SIZE/2 - 3, 0, Math.PI*2);
            ctx.fillStyle = '#ff3030';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffd966';
            ctx.beginPath();
            ctx.arc(fx + CELL_SIZE/2 - 2, fy + CELL_SIZE/2 - 2, 2, 0, Math.PI*2);
            ctx.fill();
            
            // 绘制蛇身 (渐变绿)
            for (let i = 0; i < snake.length; i++) {
                const seg = snake[i];
                const x = seg.x * CELL_SIZE;
                const y = seg.y * CELL_SIZE;
                const gradient = ctx.createLinearGradient(x, y, x+CELL_SIZE, y+CELL_SIZE);
                if (i === 0) {
                    gradient.addColorStop(0, '#8bc34a');
                    gradient.addColorStop(1, '#4caf50');
                } else {
                    gradient.addColorStop(0, '#6f9e3f');
                    gradient.addColorStop(1, '#3e8e41');
                }
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 2;
                ctx.shadowColor = '#1e3a1e';
                ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                // 眼睛 (蛇头)
                if (i === 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 0;
                    const eyeSize = 3;
                    if (currentDir === 'RIGHT') {
                        ctx.fillRect(x + CELL_SIZE - 6, y + 5, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 6, y + CELL_SIZE - 8, eyeSize, eyeSize);
                    } else if (currentDir === 'LEFT') {
                        ctx.fillRect(x + 3, y + 5, eyeSize, eyeSize);
                        ctx.fillRect(x + 3, y + CELL_SIZE - 8, eyeSize, eyeSize);
                    } else if (currentDir === 'UP') {
                        ctx.fillRect(x + 5, y + 3, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 8, y + 3, eyeSize, eyeSize);
                    } else if (currentDir === 'DOWN') {
                        ctx.fillRect(x + 5, y + CELL_SIZE - 6, eyeSize, eyeSize);
                        ctx.fillRect(x + CELL_SIZE - 8, y + CELL_SIZE - 6, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(x + 12, y + 5, 3, 3);
                        ctx.fillRect(x + 5, y + 5, 3, 3);
                    }
                    ctx.fillStyle = '#000000';
                    if (currentDir === 'RIGHT') {
                        ctx.fillRect(x + CELL_SIZE - 5, y + 6, 2, 2);
                        ctx.fillRect(x + CELL_SIZE - 5, y + CELL_SIZE - 7, 2, 2);
                    } else if (currentDir === 'LEFT') {
                        ctx.fillRect(x + 4, y + 6, 2, 2);
                        ctx.fillRect(x + 4, y + CELL_SIZE - 7, 2, 2);
                    } else if (currentDir === 'UP') {
                        ctx.fillRect(x + 6, y + 4, 2, 2);
                        ctx.fillRect(x + CELL_SIZE - 7, y + 4, 2, 2);
                    } else if (currentDir === 'DOWN') {
                        ctx.fillRect(x + 6, y + CELL_SIZE - 5, 2, 2);
                        ctx.fillRect(x + CELL_SIZE - 7, y + CELL_SIZE - 5, 2, 2);
                    }
                }
            }
            ctx.shadowBlur = 0;

            // 游戏结束或胜利时显示遮罩文字
            if (!isGameActive) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = 'bold 20px "Courier New", monospace';
                ctx.fillStyle = '#f7d44a';
                ctx.shadowBlur = 0;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                let msg = isWinFlag ? '✨ 胜利! ✨' : '☠️ GAME OVER ☠️';
                ctx.fillText(msg, canvas.width/2, canvas.height/2 - 15);
                ctx.font = '14px monospace';
                ctx.fillStyle = '#cfe6cf';
                ctx.fillText('点击「新的一局」继续', canvas.width/2, canvas.height/2 + 25);
                ctx.textAlign = 'left';
            }
        }

        // ---------- 键盘控制 ----------
        function handleKeydown(e) {
            const key = e.key;
            // 方向控制 (游戏活跃时才能改变方向,但即使结束,按方向键不作用)
            if (isGameActive) {
                let newDir = null;
                if (key === 'ArrowUp') newDir = 'UP';
                else if (key === 'ArrowDown') newDir = 'DOWN';
                else if (key === 'ArrowLeft') newDir = 'LEFT';
                else if (key === 'ArrowRight') newDir = 'RIGHT';
                if (newDir) {
                    e.preventDefault();
                    // 设置下一次移动方向 (反向限制会在移动时处理)
                    nextDir = newDir;
                }
            }
            // 全局按 R 键重置游戏 (无论状态)
            if (key === 'r' || key === 'R') {
                e.preventDefault();
                resetGame();
            }
        }

        // 启动游戏循环 (setInterval)
        function startGameLoop() {
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                if (isGameActive) {
                    moveSnake();    // 内部若结束会调用 endGame 停止循环和改变状态
                }
            }, MOVE_INTERVAL_MS);
        }

        // 初始化事件 & 首次启动
        function init() {
            // 确保食物有效
            const emptyFirst = getAllEmptyCells();
            if (emptyFirst.length > 0) {
                food = {...emptyFirst[Math.floor(Math.random() * emptyFirst.length)]};
            } else {
                food = {x: 12, y: 12};
            }
            draw();
            startGameLoop();
            window.addEventListener('keydown', handleKeydown);
            document.getElementById('restartButton').addEventListener('click', () => {
                resetGame();
            });
            // 可选:防止移动端页面滑动 (不影响键盘)
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); });
        }

        // 开始!
        init();
    })();
</script>
</body>
</html>
